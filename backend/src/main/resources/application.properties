spring.application.name=rentamax-backend
server.port=8080

# ---------- Base de datos MySQL ----------
# Formato ${VARIABLE:valor_por_defecto}: en produccion se sobreescribe con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentamax?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:rentamax}
spring.datasource.password=${DB_PASSWORD:rentamax123}

# Hibernate crea/actualiza las tablas a partir de las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Clave secreta en Base64 (minimo 256 bits). EN PRODUCCION: definir JWT_SECRET y no usar esta.
app.jwt.secret=${JWT_SECRET:yh9DyXiCkAiC1hacOTB2QBGYrmUog7mljojNkDFvvO5K37JKAb3X9D8POrjuN1I8}
# Duracion del token: 1 hora
app.jwt.expiration-ms=3600000

# ---------- Administrador inicial ----------
app.admin.email=${ADMIN_EMAIL:admin@rentamax.pe}
app.admin.password=${ADMIN_PASSWORD:Admin2026}

# ---------- CORS: dominios del front-end autorizados ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

spring.application.name=rentamax-backend
# Render define PORT dinamicamente; en local usa 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework
# No filtrar mensajes ni trazas internas al cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# =====================================================================
# ZERO HARDCODING: este archivo NO contiene URLs locales, usuarios, contrasenas ni claves.
# Todo valor sensible llega por variable de entorno (Render en la nube) o, en tu laptop,
# desde application-local.properties (archivo IGNORADO por Git; ver application-local.properties.example).
# Si falta una variable, la aplicacion NO arranca (fail-fast).
# =====================================================================

# ---------- Base de datos MySQL (remota, p. ej. Aiven) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------- Pool de conexiones HikariCP (evita la saturacion de hilos) ----------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# La BD se crea con database/schema_v1.sql (fuente de verdad).
# "validate": Hibernate SOLO comprueba que las entidades coincidan con las tablas; no crea ni modifica nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Clave en Base64 de al menos 256 bits, SOLO por variable de entorno.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Administrador inicial (solo si la BD no tiene ninguno) ----------
# Sin valores por defecto: si no defines ADMIN_EMAIL y ADMIN_PASSWORD, no se crea ninguno.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- CORS: SOLO el dominio donde esta publicado el front-end ----------
# Ejemplo: CORS_ORIGINS=https://integrador2-grupo7.vercel.app  (nunca "*")
app.cors.allowed-origins=${CORS_ORIGINS}
app.cors.allowed-origin-patterns=${CORS_PATTERNS:}

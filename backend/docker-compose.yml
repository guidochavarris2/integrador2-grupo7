# Levanta MySQL 8 en un contenedor: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: rentamax-mysql
    environment:
      MYSQL_DATABASE: rentamax
      MYSQL_USER: rentamax
      MYSQL_PASSWORD: rentamax123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - rentamax-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      retries: 20
volumes:
  rentamax-data:
